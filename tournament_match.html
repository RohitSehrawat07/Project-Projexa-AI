<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Run · EduRank</title>
    <link rel="stylesheet" href="css/tournament.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      .run-container { max-width: 600px; margin: 40px auto; background: white; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-family: 'Montserrat', sans-serif;}
      .run-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f3f4f6; padding-bottom: 15px; margin-bottom: 20px; }
      .run-title { font-size: 1.4rem; font-weight: 700; color: #111827; }
      .timer { font-family: monospace; font-size: 2rem; font-weight: bold; color: #ef4444; }
      .q-text { font-size: 1.25rem; margin-bottom: 24px; color: #1f2937; font-weight: 600; line-height: 1.4; }
      .opt-btn { display: block; width: 100%; padding: 16px; font-size: 1.1rem; text-align: left; background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-family: 'Montserrat', sans-serif; }
      .opt-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
      .opt-btn.selected { border-color: #f97316; background: #fff7ed; color: #9a3412; }
      .btn-next { width: 100%; padding: 16px; border-radius: 12px; background: #f97316; color: white; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 10px; opacity: 0.5; pointer-events: none; transition: 0.2s;}
      .btn-next.enabled { opacity: 1; pointer-events: all; }
      .btn-next.enabled:hover { background: #ea580c; }
      .result-screen { text-align: center; display: none; }
      .result-icon { font-size: 4rem; margin-bottom: 20px; }
      .score-display { font-size: 2rem; font-weight: 800; color: #f97316; margin-bottom: 10px; }
      .elo-gain { color: #10b981; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body style="background: #111827;">

    <div class="run-container" id="gameScreen">
        <div class="run-header">
            <div class="run-title">⚔️ Tournament Run</div>
            <div class="timer" id="timer">0:30</div>
        </div>
        <div id="qCounter" style="color: #6b7280; font-weight: 600; margin-bottom: 10px;">Question 1 of 3</div>
        <div class="q-text" id="qText">Loading question...</div>
        <div id="optionsCont"></div>
        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div class="run-container result-screen" id="resultScreen">
        <div class="result-icon">🏆</div>
        <h2 style="color: #111827; margin-bottom: 10px;">Run Completed!</h2>
        <div class="score-display">Score: <span id="finalScore">0</span>/3</div>
        <p class="elo-gain" id="eloGain" style="margin-bottom: 30px;">+0 ELO Earned</p>
        <button class="btn-next enabled" onclick="finishRun()">Return to Tournament</button>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/tournament_match.js"></script>
</body>
</html>
